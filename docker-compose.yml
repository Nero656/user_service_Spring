volumes:
  pg_spring_users:
  pg_spring_notifications:
  kafka_data:
  zookeeper_data:
  swagger_editor_data:

services:
  users_db:
    container_name: docker_spring_usersDB
    image: postgres:17.1-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=Nero
      - POSTGRES_PASSWORD=0907
      - POSTGRES_DB=users_db
    volumes:
      - pg_spring_users:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Nero -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification_db:
    container_name: docker_spring_notificationDB
    image: postgres:17.1-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=Nero
      - POSTGRES_PASSWORD=0907
      - POSTGRES_DB=notification_db
    volumes:
      - pg_spring_notifications:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Nero -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka
    ports:
      - "9092:9092"

  user-service:
    image: user-service
    depends_on:
      - kafka
      - users_db
    build:
      context: ./user-service
      dockerfile: Dockerfile
    restart: on-failure
    command: ./mvnw spring-boot:run
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    healthcheck:
      test: wget --no-verbose --tries=1 --spider  || exit 1
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    labels:
      amplicode.image: springboot

  notification-service:
    image: notification-service
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    depends_on:
      - kafka
      - notification_db
    restart: on-failure
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "18081:18081"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider  || exit 1
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - SWAGGER_JSON_URL=/api-docs/user-service.json
      - URLS=[{url:"/api-docs/user-service.json",name:"User Service"},{url:"/api-docs/notification-service.json",name:"Notification Service"}]
    volumes:
      - ./api-docs:/usr/share/nginx/html/api-docs
    depends_on:
      - user-service
      - notification-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/"]
      interval: 30s
      timeout: 5s
      retries: 3

  swagger-editor:
    image: swaggerapi/swagger-editor
    container_name: swagger-editor
    restart: unless-stopped
    ports:
      - "8086:8080"
    volumes:
      - swagger_editor_data:/tmp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/"]
      interval: 30s
      timeout: 5s
      retries: 3
